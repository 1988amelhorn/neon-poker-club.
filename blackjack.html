<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0c1128"><title>Neon Blackjack</title><style>*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#3b236d,#0c1128 65%);color:white;font:16px system-ui,sans-serif}main{max-width:900px;margin:auto;padding:15px}h1{text-align:center;color:#ffdb65;text-shadow:0 0 20px #ff49c6;font-size:clamp(27px,7vw,48px)}h2{color:#7bf9e2}.panel{background:#172348;border:1px solid #6061b8;border-radius:22px;padding:20px;margin:16px 0}.hide{display:none}input{padding:14px;border-radius:12px;background:#0b1633;color:white;border:1px solid #5b72ac;width:100%;font-size:17px;margin:8px 0}button{padding:13px 18px;margin:5px;border:0;border-radius:12px;background:linear-gradient(110deg,#24f3a4,#44aaff);font-weight:800;color:#06152a;font-size:16px}button.alt{background:linear-gradient(110deg,#ffdc67,#fc66c0)}.felt{background:radial-gradient(ellipse,#078d65,#024331);border:12px solid #b87945;border-radius:42% / 24%;padding:35px 10px;min-height:380px;text-align:center;box-shadow:0 15px 50px #0008}.seats{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}.seat{border:1px solid #6bf3d2;border-radius:14px;background:#071c27cc;padding:10px;min-width:110px}.seat.active{border:3px solid #ffe272;box-shadow:0 0 15px #ffe272}.cards{display:flex;justify-content:center;gap:5px;margin:12px}.card{display:inline-flex;align-items:center;justify-content:center;background:white;color:#17233b;border-radius:7px;min-width:42px;height:62px;font-weight:900;font-size:22px}.red{color:#e6385b}.muted{color:#c3d1ee}a{color:#89f5ff}.row{display:flex;gap:12px;flex-wrap:wrap}.row>*{flex:1;min-width:180px}#notice{color:#ffe579;text-align:center}#controls{text-align:center;padding:20px}@media(max-width:600px){.felt{border-width:7px;border-radius:24% / 10%}.seat{min-width:90px}.card{min-width:35px;height:52px}}</style></head><body><main><h1>♣ NEON BLACKJACK ♥</h1><p style="text-align:center"><a href="/">← Texas Hold'em</a> · Seven seats + dealer · Virtual chips only</p><section id="login" class="panel"><h2>Sign in</h2><p>Use the same Neon Poker Club account as Hold'em.</p><input id="user" placeholder="Username"><input id="pass" type="password" placeholder="Password"><button onclick="auth('login')">Log in</button><button onclick="auth('register')">Create account</button></section><section id="lobby" class="panel hide"><h2>Private Blackjack</h2><div class="row"><div><h3>Host</h3><button onclick="join(true)">Create 7-seat table</button></div><div><h3>Join a friend</h3><input id="code" maxlength="6" placeholder="6-character invite code"><button onclick="join(false)">Join table</button></div></div></section><section id="table" class="hide"><div class="panel"><h2>Room <span id="room"></span></h2><button onclick="share()">Copy invite link</button><button onclick="leave()">Leave table</button><p id="message"></p><button id="start" onclick="send('bj:start',{})">Deal next round</button></div><div class="felt"><h2>DEALER</h2><div id="dealer" class="cards"></div><p>Blackjack pays 3:2 · Dealer stands on soft 17 · 10-chip entry per round</p><div id="seats" class="seats"></div></div><div id="controls" class="panel"></div></section><p id="notice" role="alert"></p></main><script src="/socket.io/socket.io.js"></script><script>const $=x=>document.getElementById(x);let token=localStorage.getItem('neon_token'),socket,state;function show(x){for(let k of ['login','lobby','table'])$(k).classList.toggle('hide',k!==x)}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}async function api(url,body){let r=await fetch(url,{method:body?'POST':'GET',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:body?JSON.stringify(body):undefined}),j=await r.json();if(!r.ok)throw Error(j.error);return j}async function auth(kind){try{let d=await api('/api/'+kind,{username:$('user').value,password:$('pass').value});token=d.token;localStorage.setItem('neon_token',token);connect()}catch(e){$('notice').textContent=e.message}}function connect(){socket?.disconnect();socket=io({auth:{token}});socket.on('connect_error',e=>$('notice').textContent=e.message);socket.on('bj:state',render);show('lobby');let code=new URLSearchParams(location.search).get('room');if(code)$('code').value=code}async function restore(){if(!token)return;try{await api('/api/me');connect()}catch{localStorage.removeItem('neon_token');show('login')}}function send(event,args){socket.emit(event,args,r=>{if(r?.error)$('notice').textContent=r.error;else $('notice').textContent=''})}function join(create){send('bj:join',{create,code:$('code').value})}function leave(){socket.emit('bj:leave',{},r=>{if(r?.error)$('notice').textContent=r.error;else{state=null;show('lobby')}})}function share(){let link=location.origin+'/blackjack.html?room='+state.code;navigator.clipboard?.writeText(link).then(()=>$('notice').textContent='Invite link copied').catch(()=>prompt('Copy invite',link))}function cards(a){return a.map(c=>'<span class="card '+(/[♥♦]/.test(c)?'red':'')+'">'+esc(c)+'</span>').join('')}function render(s){state=s;show('table');$('room').textContent=s.code;$('message').textContent=s.message;$('start').classList.toggle('hide',!s.host||s.phase==='playing');$('dealer').innerHTML=cards(s.dealer);$('seats').innerHTML=s.players.map(p=>'<div class="seat '+(s.turn===p.id?'active':'')+'"><b>'+esc(p.name)+'</b><p>🪙 '+p.chips+' · Bet '+p.bet+'</p><div class="cards">'+cards(p.hand)+'</div><small>'+(!p.connected?'Offline':p.done?'Done':'')+'</small></div>').join('');$('controls').innerHTML=s.canAct?'<h2>Your turn</h2><button onclick="send(\'bj:act\',{action:\'hit\'})">Hit</button><button onclick="send(\'bj:act\',{action:\'stand\'})">Stand</button><button class="alt" onclick="send(\'bj:act\',{action:\'double\'})">Double</button>':'<p class="muted">'+(s.phase==='playing'?'Waiting for another player…':s.phase==='lobby'?'Waiting for host to deal':'Round finished — host can deal again')+'</p>'}restore()</script></body></html>
